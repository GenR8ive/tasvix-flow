
name: Publish

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted Publishing requires npm >= 11.5.1; use latest for reliable OIDC matching.
      - name: Upgrade npm
        run: |
          npm install --global npm@latest
          node --version
          npm --version

      # setup-node (or a repo secret) exports NODE_AUTH_TOKEN; any value here
      # makes npm use token auth and skip OIDC trusted publishing entirely.
      # Clear it so npm falls back to OIDC.
      - name: Clear NODE_AUTH_TOKEN for OIDC
        run: |
          echo "token length before clear: ${#NODE_AUTH_TOKEN}"
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Debug OIDC environment
        run: |
          node --version
          npm --version
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "OIDC ENV MISSING"; else echo "OIDC ENV present"; fi
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then echo "OIDC REQUEST TOKEN MISSING"; else echo "OIDC REQUEST TOKEN present"; fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NODE_AUTH_TOKEN unset (expected for OIDC)"; else echo "NODE_AUTH_TOKEN set (unexpected)"; fi

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check published version
        id: check
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set +e
          npm view "tasvix-flow@${VERSION}" version >/dev/null 2>&1
          result=$?
          set -e

          if [ "$result" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tasvix-flow@${VERSION} is already published."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "tasvix-flow@${VERSION} was not found; publishing will be attempted."
          fi

      - name: Build
        run: npm run build --if-present

      # TEMP DIAGNOSTIC: stage instead of direct publish to isolate
      # "allowed-actions permission" vs "config match" failure.
      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: npm stage publish

      - name: Show npm debug log on failure
        if: failure()
        run: cat ~/.npm/_logs/*-debug-*.log 2>/dev/null | tail -n 120

      - name: Create Git tag
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "v${VERSION}"
          git push origin "v${VERSION}"
